apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.frontend.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.frontend.name }}
    tier: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.frontend.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.frontend.name }}
        tier: frontend
    spec:
      containers:
        - name: frontend
          # Pulls the image directly from the OpenShift internal ImageStream built by BuildConfig
          # image: image-registry.openshift-image-registry.svc:5000/{{ .Values.global.namespace }}/{{ .Values.frontend.name }}:latest
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.frontend.port }}
              name: http
          env:
            # Passes backend service details to the frontend proxy server
            - name: BACKEND_HOST
              value: {{ .Values.backend.name | quote }}
            - name: BACKEND_PORT
              value: {{ .Values.backend.port | quote }}
            - name: PORT
              value: {{ .Values.frontend.port | quote }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5