---
# 1. Database Credentials Secret
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: postgres-vso-secret
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  vaultAuthRef: {{ .Values.vault.authName | default "vault-auth" }}
  mount: {{ .Values.vault.kvMount | default "secret" | quote }}
  type: kv-v2
  path: {{ .Values.vault.databasePath | default "dev/database" | quote }}
  refreshInterval: {{ .Values.vault.refreshInterval | default "1m" | quote }}
  transformation: {}
  destination:
    name: {{ .Values.postgresql.name | default "postgres" }}-secret
    create: true

---
# 2. GitHub PAT Secret (HTTP Auth)
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: github-gitops-token-sync
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  vaultAuthRef: {{ .Values.vault.authName | default "vault-auth" }}
  mount: {{ .Values.vault.kvMount | default "secret" | quote }}
  type: kv-v2
  path: {{ .Values.vault.githubPath | default "dev/github" | quote }}
  refreshInterval: {{ .Values.vault.refreshInterval | default "1m" | quote }}
  transformation:
    includeKeys:
      - token
  destination:
    name: github-gitops-token
    create: true

---
# 3. SonarQube Token Secret
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: sonarqube-token-sync
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  vaultAuthRef: {{ .Values.vault.authName | default "vault-auth" }}
  mount: {{ .Values.vault.kvMount | default "secret" | quote }}
  type: kv-v2
  path: {{ .Values.vault.sonarqubePath | default "dev/sonarqube" | quote }}
  refreshInterval: {{ .Values.vault.refreshInterval | default "1m" | quote }}
  transformation: {}
  destination:
    name: sonarqube-token
    create: true

---
# 4. GitHub SSH Key Secret (SSH Auth for Tekton)
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: github-gitops-ssh-sync
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  vaultAuthRef: {{ .Values.vault.authName | default "vault-auth" }}
  mount: {{ .Values.vault.kvMount | default "secret" | quote }}
  type: kv-v2
  path: {{ .Values.vault.githubPath | default "dev/github" | quote }}
  refreshInterval: {{ .Values.vault.refreshInterval | default "1m" | quote }}
  transformation:
    includeKeys:
      - ssh-privatekey
  destination:
    name: github-gitops-ssh
    create: true
    type: kubernetes.io/ssh-auth
    annotations:
      tekton.dev/git-0: "github.com"